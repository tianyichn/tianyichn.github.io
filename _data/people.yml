# Group members. Put photos in assets/img/people/ (square, ~600 px).
# Leave photo empty to show initials instead.
pi:
  name: Tianyi Chen, Ph.D.
  role: Associate Professor, School of Nuclear Science and Engineering
  photo: ""
  bio: >-
    Tianyi Chen has been at Oregon State University since 2018. His research
    in nuclear materials combines irradiation, microstructure analysis,
    multiscale mechanical testing and molecular dynamics simulation to
    support materials research and development. Before joining Oregon State,
    he was a postdoctoral research associate in the Nuclear Materials Science
    and Technology Group at Oak Ridge National Laboratory.
  degrees:
    - Ph.D. Nuclear Engineering, Texas A&M University (2015)
    - M.S. Nuclear Engineering, Texas A&M University (2013)
    - B.S. Physics, Peking University (2010)
  office: "3451 SW Jefferson Way, Radiation Center, Corvallis, OR 97331"
  email: tianyi.chen@oregonstate.edu

